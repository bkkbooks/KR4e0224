body:
  text: 小辨齋偶存卷六明顧允成撰書與鄒大澤銓部讀學靜四解具見吾道之憂讀銓事十記具見世道之憂又弟幽居岑寂時共叔兄懸想足下弟間中無事稍稍溫尋舊業料理學問邇來反覆體勘世道人心愈趨愈下只被無善無惡四字作祟君子有所淬勵却以無字埋藏小人有所貪求却以無字出脫明道先生所謂直欲和這些秉彛消殺得盡然後以為至道者正今日講學家所傳祕法眼也弟螳螂怒臂何堪車轍乃一腔隱衷良自憤悱狂語一通小見己志敢以呈上幸惟教之答羅布衣昨承賜教諄諄真是藥石之規捧誦之間不勝佩服至謂吾儕議論不當以同己者為是而不復察其非不當以異己者為非而不復取其是尤為透的雖然僕亦有鄙見不敢不就正之足下謂孟子斷夷惠為百世之師而隘與不恭又謂君子不由鄙管晏為曽西不為而不召稱管遊觀稱晏又謂其有足取以是見其朗日晴空毫無凝滯似也獨不曰距楊之無君墨之無父斷斷乎甚之為禽獸而略不假借乎更何害於孟氏之朗日晴空毫無凝滯也蓋異己之中自有差别取是之中亦有差别不可不早辨也今有人於此且為楊朱且為墨翟乃欲於無父無君之人而節取其有父有君之是正恐是未必得取而反陷於非也豈不惑之甚哉足下又曰激之為東京之節義而炎祚已促矯之為南衙之清流而善類竟殃分之為洛蜀朔之三黨而紹聖之紛更遂起往弊如斯昭然可鑒而今之儒者復蹈之此正今世道學內溺於富貴利達而外附於道德仁義者借此等口吻以便其私而禁錮為善之路僕方欲痛哭流涕於其傍而足下奈何復為此言且夫炎祚之促小人促之也善類之殃小人殃之也紹聖之紛更小人紛更之也今不歸罪於小人而反歸罪於君子是君子既不得志於當時之私人而仍不得志於後世之公論為小人者不惟愚弄其一時仍并後世而愚之也豈不與於小人之甚哉審如其言則將曰比干激而亡商龍逄激而亡夏孔子一矯而春秋遂流為戰國孟子與蘇秦張儀分為三黨而戰國遂吞於呂秦其亦何辭矣此説一行不至率天下而盡為胡廣不已也若僕則曰炎祚雖促而終有不與之俱促者善類雖殃而終有不與之俱殃者紹聖雖紛更而終有不與之俱更者則諸君子一激一矯一分之力也大抵世之儒者率以成敗論人物而不以是非論成敗故其言往往蹈此不意足下亦為所亂僕於足下所稱同己也僕亦何貴乎以同己者為是而不復察其非哉幸卒教之答友人論鯨閹承諭心迹之説弟實未有知弟之所知者天子孤立於上而背公死黨之風日引於下病在膏肓恬不知怪可為長太息耳丈以吳趙之論楚張與近時言者之論鯨張迹而比之願丈之無易由言也夫使今之柄臣事事欲反居正而舉朝扶同以除君側之所喜則其迹其心俱有可原也使今之柄臣事事欲庇居正而舉朝扶同以除居正之所仇則其迹已非更何待推其心哉且本欲去鯨張者柄臣計也而馬御史故襲呵佛罵祖之機愚弄聖明吁何其甚也丈一則曰盡其在我一則曰無以處之躬自厚而薄責於人至哉言乎抑弟不患丈之無處而患在我之難盡也夫盡其在我非可以虛辭借也必將正巳而不失獨立而不懼者也設丈在位偶值鯨張之事舉朝方如醉如癡為柄臣頤使丈縱不當先為逢而其長業已持之丈即署名則忍於欺君即不署名則敢於逆相不知丈何以盡其在我也推此類具言之則所謂我者亦大彰明較著而一切含糊籠罩之説自無安頓處矣弟一隅之見每每如此亦惟可聞於丈而已丈曰吾輩且置之弟謂如弟輩可置丈輩恐竟不可置也幸再裁教復李見羅先生往元沖父母職述而南獲承手札備悉門下引掖後進盛意方念不及伺候乃辱記存憫茲悲苦更蒙寵儀光賁慈靈哀感何已不肖幼從叔兄之後稍欲有所請事每見世之談道者芻狗躬行野狐性命心竊疑之已而因元沖受門下大學古義巳又因澄海唐曙臺受石經大學反復再四始信學問原自正平而依傍蹊徑者似不免有礙於大路也門下多難殷憂動心忍性其於知本一義當有益臻其妙者且文王居囚而易作箕子為奴而範陳古來大聖大賢往往以一身之窮而開萬古之通門下豈有讓哉如天之福門下曠然荷被恩詔則劒水梁溪亦異時之鄒魯也會須負笈宫墻不止僅僅私淑云爾肅言布謝祗增悚息仰希照亮不次與徐孺東符卿門下仁心義膽冠冕人倫僕幸托於氣類之末獲侍下風誠千古大快奉别以還忽易寒暑有客從貴溪來稱説門下方掩關參玄此意味大自可想僕辱愛誨不敢浪擲日月稍稍請事六經第心粗氣浮苦不得其門而入念惟門下靜中端倪直造先天何以發我瞶瞶也昨聞南臯鄒公與門下有廬山之約今且何如鄒公真正豪傑僕居恆視之若在九天之上世道人心所仰賴此公不小即此公亦必始終以天下自任斷然不欲以萬死一生之身輕為轉移但僕向遊京師有一長者為僕言鄒公最不喜人以氣節相目僕問其故似以節義為血氣也夫假節義乃血氣也真氣節即義理也血氣之怒不可有義理之怒不可無義理之氣節不可亢之而使驕亦不可抑之而使餒以義理而誤認為血氣則浩然之氣且無事養矣近世鄉願道學往往借此等議論以消鑠吾人之真元而遂其同流合汚之志其言最髙其害最逺以鄒公之周於德萬萬非邪世所能亂而復嘵嘵爾者正以敬鄒公之深望鄒公之至不覺吐露狂臆而不自知其過也門下於鄒公知契極篤僕輒因而有請焉僕竊謂鄒公但將當初一念自磨自勘倘發自血氣乎當默默淘洗不可輕出諸口以槩義理之怒倘發自義理乎就此直養無害便是天下第一等聖賢第一等道學不必舍此而更求神化也門下以為然否率爾附候併布其私以就正於門下乞門下有以裁之答孟我疆比部屢承面誨時動深省乃者辱投贈言明以孔子相朂此門下肫肫不倦之仁也鄙人即不敏能不從事第門下之所主大段在委吏乘田之事而鄙人之所偏大段在春秋沐浴之義不知於此之際為一孔子乎為兩孔子乎願學孔子者將學其一乎將學其兩乎一而兩兩而一門下自有獨解非鄙人所能測也請卒教之與唐曙臺儀部論心學書二條先儒有云王道本於誠意又云本心為萬事根本傳格致者乃獨本修身何也蓋經文齊家治國平天下緊貼修身説來故傳者斷自修身語勢自當如此其實正心誠意在其中矣大抵修身有偏言者有兼言者八條目互舉修身偏言之也格致傳單舉修身兼言之也故中庸曰齊明盛服非禮不動所以修身推此類可見若以其偏言者例其兼言者乃曰心意可匿身則難藏其不本正心誠意而本修身殆有精義不免穿鑿附會且夫掩其不善而著其善人之視已如見其肺肝然心不在焉視而不見聽而不聞食而不知其味彼心意豈可匿之物哉心學之弊固莫有甚於今日然以大學而論則所謂如見肺肝者也何嘗欺得人來却是小人自欺其心耳此心蠧也非心學也若因此便諱言心學是輕以心學與小人也易咸九四不言心而彖曰感人心則咸其心之義也艮六四不言心而象曰思不出其位則艮其心之義其曰貞吉則道心之謂曰憧憧則人心之謂也艮其身亦猶大學之揭修身蓋心在其中矣何諱言心之有夫身不能必其皆修必不可以不修身之故為身諱意不能必其皆誠必不可以不誠之故為意諱與其諱之而以妄廢真孰若勿諱之而以真救妄也願卒教之與郭希宇中丞向承門下問不肖於菰蘆中此意殊不薄也爾時匆匆布謝未盡欲言嗣後不肖又為家慈衰病尋罹大戚無能申候其於髙義獨心藏之而已方今世局推移向來建言巨公爵位日益聞望日損遂令當事以言者為易與轉加詬斥所謂吾黨有過未易專以尤人也門下不流不倚闕别所謂毫釐而千里者苦不敏之資未知所入也足下有以教我敬引領以俟答李還素民部蓋弟往從都門曽一再奉風旨私志大雅無日忘之乃客嵗王玄菴來辱足下儼然懷之好音奬借盈溢誨勞肫懇何足下之臭味不約而同也足下邇日意興何似弟為老母衰年多病方忤朝命天下事正有公等在耳昨足下來教云天下事尚可為於今為甚程伯子真聖人矣誦此三言具見足下憂時之思救時之用雖然有程伯子之志則可無程伯子之志則願也若論吾輩下學規模則以魯男子之不可學栁下惠之可畢竟所差不逺且眼前世局揆之往時益不堪論弟嘗妄謂今世大患不在於敢為小人在於小人而敢自任以為聖人耳足下業推赤心置我腹中弟能不推赤心置足下腹中耶闕公論收之於上鄒大澤趙儕鶴諸君子相與協贊之於下壬辰之外計癸巳之內計甲午之廷推其赤幟也故政府積不能平多方齮齕二三耆碩齎志以去逮孫立亭為政始抱銓部之權一朝奉之於政府乙未外計亦其赤幟也故立亭在事而後政府有不曲護司官之奬有司官皆謹慎奉法之奬而後楊都諌明目張膽力攻其所異首發大難之端一時臺省中風狂走迄於今牢不可破者凡以政府為之地也似不宜專其責於銓部而寬其責於政府也如何如何且年來不測恩威或出於聖明反本窮原實政府不便於異己百計逄迎之及其弄假成真乃欲以虛詞飾語託於救解之迹籠絡天下之耳目令惡聲偏歸於上爭端踵起於下而已獨處於無事朝廷與天下為蚌鷸而已且為漁人是可忍也孰不可忍哉答彭旦陽儀部足下謂我大體已得七八似未必然其以應用不足規我則弟生平大病也足下向言尋章摘句朝誦夕維終是經生近言調攝血氣喜怒不著自有條理此知足下心得之深直透未發前氣象即六經且為足下注腳矣但恐此意習慣將來任心太過不無走作其害非細足下必曰聖賢之學心學也吾任吾心何走作之有不知道心可任也人心不可任也道心難明人心易惑弟能不為足下重懼哉弟近來頗無徑悟只信得六經義理日益親切句句是開發我道心處句句是喚醒我人心處學問不從此而入斷非真學問經濟不從此而出斷非真經濟孔子所以好古敏求而惡夫何必讀書者也故為足下者以調攝為主而以誦讀為助則可以調攝為務而以誦讀為仇則不可弟敢以此自效於足下足下無復曰經生之談云爾又道學兩字自是吾輩家常茶飯近來却被曉人做壞墮入鬼關昔賢謂人之求富貴利達者昏夜乞哀以驕人於白日弟則謂今之求道德仁義者白日乞哀以驕人於昏夜世變轉惡良足長吁要之吾輩姑務自鏡無徒徙宅忘身為也與丁長孺中舍年丈春來意氣何如以年丈識局大可有為山林事功願早圗之也弟尚記往年請教於荆溪萬履翁翁應之曰吾輩向來也只是搭過其言最便易最肯綮弟懷之二十餘年竟不脫此兩字今拈示吾兄當謂然否小草二册附博一笑别具家兄柬中者不更及答曾金簡儀部沈祁陽歸拜手翰之辱空谷足音喜慰曷似至以大學忠告見貽尤感年丈之不以戔戔而棄我也弟嘗妄意陽明先生提良知似虛而實見羅先生提修身似實而虛兩者如水中月鏡中花妙處可悟而不可言真所謂會得時活潑潑地會不得只是弄精神者也今鄒南臯全用掃法而年丈半用接法正不妨相與為春秋冬夏四時行耳如何如何與王淡生銓部時欲浮剡溪之棹時復不果恐君家子猷先生笑人耳間居無事間寓目門下代庖録竊以為非有三代直道而行心胸未堪辦此所以發我憒憒者多矣欣幸欣幸春和景明東林大有佳色未識文從能扁舟一過否不敢請耳固所願也率言申候不盡答嶽石帆繕部武穆之後也向隱嶽為樂今請復之年丈遂復稱嶽開緘見字頓令兩眼光明快不可言小草尚慚鳶飛魚躍年丈何謂見所未見也如命并説義奉上數通望教之外呈朱子二大辨刻蓋弟生平憤悱此中機竅恰於目前人心世道煞有關涉年丈或與同志重加參證更得髙論辨首益廣其傳最妙事也弟嘗見彼氏流行內典牙籖緗帙動費無量而吾儒家殊爾寂寂近徐玄丈梓四大儒全書真稱空谷足音更唱迭和非吾輩之責而誰責哉簡錢啓新御史昨奉教具見兄近時得力處兄精神局量不啻十倍於弟既認取把柄到手何聖賢之不可為弟苦眼髙手生進寸退尺雖稍稍影窺要不濟事願兄痛下針銼不容絲髮藏躲最大快也目前吾郡友朋之多恐從來僅見且并蒙聖恩寬大假以間身似非偶然若更當面錯過真成辜負矣妄意縱談兄謂如何簡薛玄臺國博弟與丈纍年離索兩畨合并益覺丈仁體流行喜甚喜甚內典自不妨一涉但口滑耳頑最箇中大病程子比之淫聲美色意慮深逺幸丈勿好談之又浮光並駕千里咫尺今者却成咫尺千里聚散事大無常迅速得丈言及重憮然也丈與玄室兩賢相處可謂金玉其相人各有短亦各有長朋友間須去兩短集兩長方得實益若守住故吾到底與間追逐無異也弟好為此言而褊心難正願丈盡情針砭耳丈力辭考官良是良是大槩眼前時勢正我輩儉德之時但求不愧本分已是大難更不容外面襯貼些些也聞劉大夫最好相處真是樂事所云俸金會須決意辭之吾人立身行己豈容一向滚滚度日子耶又青雲不堪重足下乃足下堪重青雲此可喜耳世途嶮巇吾輩一轉眼便生荆棘足下始進姑且守中以俟時發弟非勸足下阿世者也曾見湖廣録否其旨絶藴藉懇惻最令人有動心處于斯之臻稱獨步矣敬以一册奉寄試共長公參之以為何如又兄見過於智心安於仁凡弟所云乃責備之義要與兄大體無干也不必自是不必自非在以大公順應四字消化之而已兄有玄室朝夕自當日進獨弟離羣索居欲寡其過而未能也如何又善卷之行可稱絶勝恨丈不共之耳豈吾輩尚有俗緣而丈清風出人即樂山樂水猶為染俗耶成公書如命付去頃陳斗原亦曽乞一二緘往南中弟並無侑之者不敢以處己亦不敢以處人也如何如何又方意足下日坐青氊共二三子尋舞雩陋巷故事大自有致乃不謂有賈生云云令人扼腕要以有足下鳴其不平即賈生之日月自在也文石間以書至亦殊以足下為念此兄明快過人當不會墮落耳弟向與足下促膝往往從善謔中錯却實益近默默省察足下一言一動俱弟藥石方將步步趨趨不敢不努力也天下事到頭可知業不足置意惟吾輩各取所長無護己短向宇宙內大開眼目或不枉出世一場耳何如何如又兄以浴乎五牧者為假涇凡乎涇凡亦何易假也弟生平拘拘偶然露出狂態而又不蒙兄喟然此後必得中行而與之矣承教終當服膺兄姑無夷我於方之外也又屢中方人自是端木家風必欲將此作顔生公案終是客氣未盡耳人非聖人孰能無過武侯教令寧可不勉大要弟失之太踈兄失之太密玄室景逸乃吾師也如何如何又弟自取其大要之兄之督過亦非小也知尺不如行寸此真名言但不可靠豫欲無言公案將吾與回言終日一段意思抹摋耳習氣深重吾人通患自今須如孤軍遇敵痛戰一畨不得悠悠也浮光題名遂同吾錫兄尚可以三吳第一人遮面弟則何堪與兄並哉一笑此月二十四日弟將有事邑中兄能相逢於九龍峰下否倘得玄室丈共之尤所樂也又兩儀先後亦是文義一事丈有概於中異日可面叩耳名根二字真學者痼疾然吾輩見得是處得做且做若每事將此箇題目光光抹摋何處開得口轉得身也説起著述便道名根不知日用動靜誰非著述丈以為然否下榻之談了無形影人言果不足盡據也天且雨陸走未便白下之使姑暫徐之行者不便㩦書弟僅有一扇耳又根原枝委總是一般大趨既正起處既真信目所視信口所哦頭頭是道不必太生分别也所論俞諸兩君俱屬實際弟無以易頃見葉玄室移景逸書亦不免墮入玄妙窟裏世人有志者少無志者多幸而得一有志者却又為魔説奪去痛哉痛哉景逸見極真文石穎悟絶人一超直入皆的然維道之器弟與丈須共相切磋立住腳跟不可遜也弟將以來月初六七間過宅同往荆溪便中幸一聞之文石又别之夕過雲從共許葉苖三兄夜話轉念不可無足下耳其明日入鄉矣州大夫之意自是眷眷但往來屑屑昔賢所笑我輩安可更墮落此中知足下同之也聞學道急欲丈往丈事體稍與弟别宜何處焉弟答州大夫書如命奉上又足下治家園良是弟邇來亦絶無得力但嘗玩洗心退藏之句意中每有無限自失處兄以為何如右武果然快士兄以顔子律之真藥石也率此布復並致謝伯兄又直諒之規難得於世久矣不圗有汝陽君一則以喜吾德之不孤一則以懼充義之未盡耳弟近懷略具小草並往就正伯兄但作漆園達乎將情之所鍾正在我輩也簡髙景逸大行伏承手示如對面談不肖向來頗妄意著述乃今反復參取無開口處何以似吾丈也吾丈韋編當且幾絶俟秋涼圗促膝叩之又昨帶月過我溪頭此誼甚佳惟是弟不能為主乃更為客即世情可略頗亦太簡矣吾鄉自文莊公後學問寥寥頃見吾丈意味肫肫斯道之明於是乎兆曷勝欣躍倘有同志如丈者間舉月會以解離索實弟所願侍也又客嵗承教言弟蓋思之纍月而竟不能更端以請益於足下不得其間也夫論道以中則豈復有他説哉但弟生平左見怕言中字以為吾輩學問須從狂狷起腳然後能從中行歇腳凡近世之好為中行而每每墮入鄉願窠臼者只因起腳時便要做歇腳事也蓋落腳即是中行惟聖人天理渾然毫無私欲則可自聖人以下便有許多私欲糾牽所以孔子告顔子曰克己而其稱之亦曰有不善未嘗不知知之未嘗復行其緊要工夫自是如此若不向私欲處悉力斬絶而遽言中行所謂藉冦兵而齎盜糧未有不敗者也足下資養純粹大都是中行體段當不類近世之為但此意切須點檢庶幾將來不認賊作子耳愚者千慮姑以請正足下以為何如昨友人寄到唐曙臺所編刻二程類語頗便觀覽敢奉上一部又承兼老寄來新刻可謂正大見天地之情且喜向來硜硜謬有符於諸君子當車有人即螳螂亦堪托一臂之力矣幸為致謝朱子大辨二緘分奉徐朱兩公并為轉上又見手札及商語引何內省之切也程子曰罪己責躬不可無不可留在胸中為悔此意亦不可不知耳又日來吟風弄月大自得趣弟却自覺謔語太多殊妨道器此橫渠所以致戒於東銘也如何如何又曽見趙豸史彈文否何善變如此石帆兄何以破之若不將大計題目盡情發揮便落劫矣又不晤許久時時在念及會面又復默然要以道理經古人發揮已盡直是無開口處顧力行何如耳又荆溪竟不果行丈所見良是即此小小動定道理無窮信乎精義之難也朱子語略及荆川所抄似為家兄擕去有學的二册乃丘文莊所次殊有條理丈試閲之何如又冡宰定於陳心老良善頃見朱黃門疏其中乃有種種異哉內閣用翰林冡宰用别衙門尚有相持之意所謂存十一於千百者奈何又欲并歸一路以行其私乎又趙君參選君本昨見其詳貪汚之迹恐未必然但麻馮去留不可辭耳大計一節亦微示意於彌天網中論者或更有春秋未可知也弟奉晤當不出初十左右勿令邇齋季思先往洞庭虛積懷也又時事益覺駭人不意此君遂作鷹犬之尤也老婆心切未易冷落奈何奈何天下事儘無窮却悔當初粒米狼戾耳又昨者聖明遇災思懼將别用向來得罪諸臣此真美意乃頃見部疏如某某猶然臚列而舉吾所知如錢起莘嶽石帆反不得與即人各有見豈宜謬戾如此吾輩立身行已誠不以取舍為重輕苐當事舉動爾爾更為世道添一隱憂耳生平負一片熱心無可告語便中附及不盡不盡又此老氣象已是如此乃其窟穴真足下所謂口欲言而未能者信乎其為氣也配義與道無是餒也今且勉從集義上用力庶幾發揮有根耳日月如流轉眼間便與足下有離索之感意欲於二十一日候足下過緑蘿菴中一談且已寄聲玄臺矣又緑隂青野誠足消暑然我輩學問須在火坑裏乘涼丈真其人也如弟反悠悠無得力處耳時事復一變此後當漸入佳境矣如何如何經略人多少其才然世號為多才者亦止了得自己富貴耳若果心真造化可回也又玄臺近有聞否昨張文石書來津津論學其所見直自一刀兩斷絶不作葛藤態未易得也渠甚欲與足下一商敢以其來柬三紙奉覽幸共參之又玩所與逯兄諸書真切懇到實用力者自别弟念自束髮從叔兄後妄意問學今二毛種種矣猶然故吾也今得丈如此夾持將來或不枉過一生耳三時記奉上中間所述少湖自麓諸先達語真吾輩頂門針也三復喜幸又恐徒作一場好話看過辜負兩翁如何如何又二麥少收三時亢旱米價日增人情日洶聞趙父母嚴閉糴之禁有粟者既不得專其利足下倡平糶之法無粟者又幸得沾其惠甚盛甚盛但趙父母能使有粟者不專其利而未必無粟者之沾其惠也足下能使無粟者得沾其惠而未必有粟者之盡如足下也足下倘以平糶之説告之趙父母趙父母以平糴之説勸之各大家則以一邑之有餘補一邑之不足其事易其功普豈不快哉惟足下裁擇如何如何又綱目最宜檢點向愧未及丈讀時或有與朱子異同處幸隨意記存弟當從容請教耳無善無惡四字干涉頗大願丈從頂門上下幾語為望為望又從前聖賢論學只是平鋪地放著自有意味若大驚小怪粧模做樣舉似聖賢何啻千里程子云後人雖有好言語只被氣象卑終不類道正謂此耳大疏今始詳讀一過直是腳踏實地任人喚作宋頭巾到底不失本色真近時對病之藥也病中簡叔時三兄弟病已去十之四五朝來理髮且落其半引鏡自對鬢增二毛矣人生真如朝露耳因思憤忘食樂忘憂不知老之將至聖人也食忘憤憂忘樂不知老之將至庸人也釋氏空諸有老氏後其身皆知老之將至者也而今髙不能為二氏下不能為庸人中不能為聖人方且混於知不知之間其如之何病間偶占得應盡須盡吟聊以寄興兄一正之小辨齋偶存卷六
